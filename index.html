<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBEE | Download Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --neon-green: #39FF14; --neon-orange: #FF5F1F; --graphite: #1A1A1A; }
        body { background: var(--black); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; text-align: center; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .logo { font-size: 80px; font-weight: bold; color: white; margin-bottom: 10px; }
        .logo span { color: var(--neon-orange); }
        .tagline { font-size: 24px; color: var(--neon-green); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .download-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .btn-download {
            background: var(--graphite); border: 2px solid var(--neon-green); color: white; padding: 20px 40px;
            font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 5px; transition: 0.3s;
            min-width: 200px; display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .btn-download:hover { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); transform: translateY(-5px); }
        .btn-orange { border-color: var(--neon-orange); }
        .btn-orange:hover { background: var(--neon-orange); box-shadow: 0 0 20px var(--neon-orange); }
        .version { font-size: 12px; margin-top: 10px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">VY<span>BEE</span></div>
        <div class="tagline">Conecte. Compartilhe. Viva.</div>
        <p>A primeira plataforma 4K Ultra-Low Latency para Gamers e Atletas.</p>
        <div class="download-container">
            <a href="#" class="btn-download" onclick="alert('Inscrição confirmada! Você será notificado do lançamento Alpha em 4K.')">
                INSTALAR NO PC
                <span class="version">Versão 1.0.0 (Windows)</span>
            </a>
            <a href="#" class="btn-download btn-orange" onclick="alert('Inscrição confirmada! Link da Play Store será enviado ao seu e-mail.')">
                INSTALAR ANDROID
                <span class="version">Google Play Store</span>
            </a>
        </div>
    </div>
</body>
</html>
